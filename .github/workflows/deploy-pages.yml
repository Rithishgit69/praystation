name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the web game
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shared leaderboard: set the repository variables SUPABASE_URL and SUPABASE_ANON_KEY
      # (Settings → Secrets and variables → Actions → Variables) and every deploy points the game at
      # that board — no file edits needed. See docs/LEADERBOARD.md for the table to create.
      - name: Configure the shared leaderboard
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "require('fs').writeFileSync('public/leaderboard.json', JSON.stringify({ provider: 'supabase', url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_ANON_KEY }, null, 2))"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
