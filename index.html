<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="The Temple of Eka-Danta — a cinematic mythological adventure. Explore an abandoned moonlit temple whose murals awaken playable memories inspired by traditional stories of Ganesha." />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>The Temple of Eka-Danta</title>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Game view"></canvas>
    <div id="ui"></div>
    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="boot-glyph">ॐ</div>
        <h1 class="boot-title">The Temple of Eka‑Danta</h1>
        <p class="boot-sub">An atmospheric mythological adventure</p>
        <p class="boot-disclaimer">Inspired by traditional stories; all events, characters and the temple in this game are fictional. Sacred figures are portrayed with respect.</p>
        <div class="boot-progress"><div id="boot-bar" class="boot-bar"></div></div>
        <p id="boot-status" class="boot-status">Waking the temple…</p>
        <div class="boot-buttons">
          <button id="boot-continue" class="boot-continue" hidden>Enter</button>
          <button id="boot-new" class="boot-continue boot-secondary" hidden>New game</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
